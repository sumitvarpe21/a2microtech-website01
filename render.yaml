services:
  - type: web
    name: a2microtech-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: a2microtech-db
          property: connectionString

databases:
  - name: a2microtech-db
    databaseName: a2microtech
    user: a2microtech